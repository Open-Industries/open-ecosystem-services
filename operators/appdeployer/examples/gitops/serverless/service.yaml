apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: orders-functions
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "20"
        autoscaling.knative.dev/target: "50"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
        - name: user-container
          image: quay.io/open-industries/orders-functions:initial
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: serverless
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

